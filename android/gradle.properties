# JVM 参数：Compose 编译比较吃内存，2G 起步
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 并行构建 + 缓存，加快二次编译
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ============================================================
# 高德地图 Key（必填，否则地图无法显示）
# ============================================================
# 申请地址：https://console.amap.com/dev/key/app
# 绑定要求：Key 必须与「应用包名 + 签名 SHA1」绑定
#     包名：net.game5048.baobao
#     SHA1：用 keytool 或 Android Studio 的 Gradle 面板 signingReport 获取
# 详细步骤见 README「第 6 节 配置高德地图 Key」。
#
# 留空也能编译通过，但地图会显示「INVALID_USER_KEY」。
AMAP_API_KEY=
